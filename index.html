<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运输船</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#071018;color:#e7e2d6;font-family:Bahnschrift,"Segoe UI","Microsoft YaHei",sans-serif;user-select:none}
#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%}
#vignette{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 140px rgba(0,0,0,.45);z-index:2}
#flash{position:fixed;inset:0;background:#8a1515;opacity:0;pointer-events:none;z-index:3;mix-blend-mode:multiply}
body.low #vignette{box-shadow:inset 0 0 180px rgba(90,10,16,.72)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:4;display:none}
#hpbox{position:absolute;left:22px;top:18px;width:280px}
#hpbox .row{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.14em;color:#c9c3b4}
#bar{margin-top:6px;height:8px;background:rgba(0,0,0,.45);outline:1px solid rgba(255,255,255,.18)}
#bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#8f2d2d,#d7c15a 40%,#7dba6a);transform-origin:left center}
#mid{position:absolute;left:50%;top:16px;transform:translateX(-50%);text-align:center}
#face{font-size:13px;letter-spacing:.42em;color:#e6d7b0}
#clock{font-size:22px;letter-spacing:.12em;margin-top:2px}
#score{position:absolute;right:22px;top:18px;text-align:right;font-size:13px;letter-spacing:.12em;color:#d9d3c6}
#score b{display:block;font-size:28px;font-weight:600;letter-spacing:.04em}
#feed{position:absolute;left:22px;top:78px;display:flex;flex-direction:column;gap:4px}
#feed div{font-size:13px;background:rgba(0,0,0,.38);padding:3px 8px;width:max-content;color:#efe8da}
#map{position:absolute;left:18px;bottom:18px;width:180px;height:180px;background:rgba(0,0,0,.35);outline:1px solid rgba(255,255,255,.2)}
#wep{position:absolute;right:24px;bottom:22px;text-align:right}
#wname{letter-spacing:.28em;font-size:13px;color:#e6d7b0}
#ammo{font-size:42px;line-height:1;margin-top:4px}
#ammo span{font-size:18px;color:#b7b1a4}
#slots{margin-top:8px;display:flex;gap:6px;justify-content:flex-end}
#slots i{min-width:52px;padding:3px 6px;font-style:normal;font-size:12px;letter-spacing:.08em;background:rgba(0,0,0,.35);color:#b7b1a4;outline:1px solid rgba(255,255,255,.12)}
#slots i.on{color:#1a140c;background:#d7c07a;outline:none}
#rbar{margin-top:8px;height:3px;width:160px;margin-left:auto;background:rgba(255,255,255,.15);display:none}
#rbar i{display:block;height:100%;width:0;background:#e6d7b0}
#ch{position:absolute;left:50%;top:50%;width:0;height:0}
#ch b{position:absolute;background:#f4f1ea;box-shadow:0 0 0 1px rgba(0,0,0,.75)}
#ch .h{width:10px;height:2px;top:-1px}
#ch .v{width:2px;height:10px;left:-1px}
#ch .l{right:var(--g);margin-right:0}
#ch .r{left:var(--g)}
#ch .u{bottom:var(--g)}
#ch .d{top:var(--g)}
#hit{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
#hit b{position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.65)}
#hit b:nth-child(1){width:11px;height:2px;left:10px;top:-1px}
#hit b:nth-child(2){width:11px;height:2px;right:10px;top:-1px}
#hit b:nth-child(3){width:2px;height:11px;left:-1px;top:10px}
#hit b:nth-child(4){width:2px;height:11px;left:-1px;bottom:10px}
#hit.hs b{background:#ff5a4a}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:32px;letter-spacing:.28em;text-shadow:0 2px 10px #000;opacity:0}
#inds{position:absolute;inset:0}
#inds i{position:absolute;left:50%;top:50%;width:8px;height:64px;margin-left:-4px;margin-top:-168px;background:linear-gradient(#ff3b3b,transparent);transform-origin:4px 168px;opacity:0;border-radius:4px}
#hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-size:13px;letter-spacing:.16em;color:#f0e2bc;opacity:0}
#ov{position:fixed;inset:0;z-index:6;display:flex;align-items:center;background:linear-gradient(90deg,rgba(5,9,14,.88),rgba(5,9,14,.5) 42%,rgba(5,9,14,0) 70%)}
#ov.hide{display:none}
.card{width:min(460px,92vw);padding:42px 40px 32px 48px;pointer-events:auto}
h1{margin:0;font-size:64px;font-weight:650;letter-spacing:.34em}
.sub{margin:8px 0 22px;letter-spacing:.42em;color:#d7c07a;font-size:13px}
.card p{margin:0 0 8px;color:#c9c3b4;font-size:14px;line-height:1.7}
.card ul{margin:8px 0 18px;padding:0;list-style:none;color:#d5d0c4;font-size:13px;line-height:1.85}
.card li span{display:inline-block;min-width:92px;color:#e6d7b0;letter-spacing:.08em}
button{background:#d7c07a;color:#1c160e;border:0;padding:12px 22px;font:inherit;font-weight:700;letter-spacing:.2em;cursor:pointer}
button:hover{background:#edd28f}
.row2{display:flex;gap:10px;align-items:center;margin:14px 0}
input[type=range]{width:160px;accent-color:#d7c07a}
.foot{margin-top:18px;font-size:12px;color:#8d887c;letter-spacing:.06em}
#board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:320px;background:rgba(8,10,14,.78);outline:1px solid rgba(255,255,255,.16);padding:14px 16px;display:none;pointer-events:none}
#board h3{margin:0 0 8px;font-weight:600;letter-spacing:.28em;font-size:13px;color:#e6d7b0}
#board table{width:100%;border-collapse:collapse;font-size:14px}
#board td{padding:4px 6px}
#board tr.me td{color:#f0d78a}
#err{position:fixed;left:12px;bottom:12px;z-index:9;color:#ffb4b4;white-space:pre-wrap;max-width:70vw}
</style>
</head>
<body>
<div id="view"></div>
<div id="vignette"></div>
<div id="flash"></div>
<div id="hud">
  <div id="hpbox"><div class="row"><span>生命</span><span id="hpnum">100</span></div><div id="bar"><i></i></div></div>
  <div id="mid"><div id="face">船头</div><div id="clock">06:00</div></div>
  <div id="score"><span>击倒</span><b id="kills">0</b></div>
  <div id="feed"></div>
  <canvas id="map" width="180" height="180"></canvas>
  <div id="wep">
    <div id="wname">步枪</div>
    <div id="ammo">30<span>/90</span></div>
    <div id="slots"><i data-k="rifle">1 步枪</i><i data-k="pistol">2 手枪</i><i data-k="shotgun">3 霰弹</i></div>
    <div id="rbar"><i></i></div>
  </div>
  <div id="ch" style="--g:8px"><b class="h l"></b><b class="h r"></b><b class="v u"></b><b class="v d"></b></div>
  <div id="hit"><b></b><b></b><b></b><b></b></div>
  <div id="toast"></div>
  <div id="inds"></div>
  <div id="hint"></div>
  <div id="board"></div>
</div>
<div id="ov">
  <div class="card" id="menu">
    <div class="sub">货轮甲板</div>
    <h1>运输船</h1>
    <p>船尾舱、左右舷与中路货舱。清空甲板，或撑到时间结束。</p>
    <ul>
      <li><span>WASD</span>移动</li>
      <li><span>鼠标</span>视角 · 左键射击 · 右键瞄准</li>
      <li><span>R</span>换弹</li>
      <li><span>Shift</span>冲刺 · Ctrl / C 蹲 · 空格跳</li>
      <li><span>1 2 3</span>步枪 / 手枪 / 霰弹枪</li>
      <li><span>Tab</span>计分板 · M 静音 · Esc 暂停</li>
    </ul>
    <div class="row2"><span>灵敏度</span><input class="sens" id="sensA" type="range" min="0.4" max="2.2" step="0.01" value="1"></div>
    <button id="play" type="button">进入甲板</button>
    <div class="foot">原创货轮场景，并非任何商业游戏的官方地图或素材。</div>
  </div>
  <div class="card" id="pause" style="display:none">
    <div class="sub">暂停</div>
    <h1 style="font-size:48px;letter-spacing:.2em">待命</h1>
    <p>鼠标已释放。回到甲板后继续交火。</p>
    <div class="row2"><span>灵敏度</span><input class="sens" id="sensB" type="range" min="0.4" max="2.2" step="0.01" value="1"></div>
    <button id="resume" type="button">继续战斗</button>
  </div>
  <div class="card" id="end" style="display:none">
    <div class="sub" id="endsub">战斗结束</div>
    <h1 id="endtitle" style="font-size:46px;letter-spacing:.16em">甲板清空</h1>
    <p id="endbody"></p>
    <button id="again" type="button">再来一局</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script>
'use strict';
if (!window.THREE) {
  document.getElementById('menu').innerHTML = '<h1>引擎未加载</h1><p>需要网络以加载 Three.js，请刷新重试。</p>';
} else {
const THREE = window.THREE;
const GRAV = 24, JUMP = 7.15, STEP = 0.42, PR = 0.34, GOAL = 15;
const $=id=>document.getElementById(id);
const UP = new THREE.Vector3(0,1,0);
const right = new THREE.Vector3();
const forward = new THREE.Vector3();
const vel = {x:0,z:0};
const player = {x:7.2,y:0,z:46,vy:0,yaw:0,pitch:0,hp:100,alive:true,crouch:false,onGround:true,kills:0,deaths:0,streak:0,invul:0,lastKill:0};
const keys = {};
let mode = 'menu', paused = false, countdown = 0, remain = 360, deathT = 0, goT = 0;
let lmb = false, lmbPrev = false, rmb = false, sensMul = 1, muted = false;
let adsBlend = 0, crouchBlend = 0, recoilP = 0, vmKick = 0, landKick = 0, roll = 0, bobT = 0, sprinting = false, sideSpeed = 0;
let cur = 'rifle', reloadLeft = 0, shotCd = 0, flashA = 0, toastT = 0, stepT = 0, cineT = 0, hitFade = 0;
let ac = null, master = null, windGain = null;
const solids = [], floors = [], walls = [], mapBlips = [], bots = [], botTargets = [];
const SPAWNS = [
  [7.2,0,46,0],[-11.0,0,49,0],[0,0,50,0],[7.3,0,24,Math.PI],[-7.3,0,24,0],
  [0,-3.15,0,0],[7.3,0,-40,Math.PI],[-7.3,0,-40,Math.PI],[0,0,-43,Math.PI],[2,0,40,Math.PI]
];
const WPD = [
  [7.3,0,46],[7.3,0,36],[-7.3,0,36],[0,0,36],[-11.1,0,50],[0,0,50],[-7.6,0,53.2],
  [-7.6,1.55,51.6],[-7.6,2.85,49.6],[-7.55,3.9,48.35],[-2,3.9,50],[1.1,3.9,45.5],
  [7.3,0,25],[-7.3,0,25],[2.5,0,25],[-2.5,0,25],
  [7.3,0,12],[-7.3,0,12],[2.6,0,14],[-2.6,0,14],
  [0,0,16],[0,-1.05,13.2],[0,-2.15,10.4],[0,-3.15,7.6],[0,-3.15,0],[0,-3.15,-7.6],[0,-2.15,-10.4],[0,-1.05,-13.2],[0,0,-16],
  [7.3,0,4],[-7.3,0,4],[7.3,0,-4],[-7.3,0,-4],
  [7.3,0,-25],[-7.3,0,-25],[0,0,-26],[2.5,0,-25],[-2.5,0,-25],
  [7.3,0,-40],[-7.3,0,-40],[0,0,-43]
];
const WP = WPD.map(p=>({x:p[0],y:p[1],z:p[2]}));
let EDGES = [];
const guns = {
  rifle:{name:'步枪',auto:true,rpm:640,dmg:27,hs:2.55,magSize:30,res0:90,spread:0.0036,moveSpread:0.013,pellets:1,reload:1.85,falloff:80,kick:0.021},
  pistol:{name:'手枪',auto:false,rpm:480,dmg:23,hs:2.2,magSize:15,res0:45,spread:0.002,moveSpread:0.009,pellets:1,reload:1.3,falloff:50,kick:0.03},
  shotgun:{name:'霰弹枪',auto:false,rpm:92,dmg:9,hs:1.35,magSize:6,res0:24,spread:0.06,moveSpread:0.018,pellets:8,reload:2.15,falloff:16,kick:0.052}
};
for (const k in guns){ guns[k].mag=guns[k].magSize; guns[k].res=guns[k].res0; }

const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
$('view').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd7e3ea);
scene.fog = new THREE.Fog(0xd7e3ea,60,195);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.08, 600);
const pitchRig = new THREE.Object3D();
const yawRig = new THREE.Object3D();
pitchRig.add(camera);
yawRig.add(pitchRig);
scene.add(yawRig);
const sun = new THREE.DirectionalLight(0xfff0d4,2.75);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.bias = -0.00035;
sun.shadow.normalBias = 0.045;
const sc = sun.shadow.camera;
sc.left=-26; sc.right=26; sc.top=26; sc.bottom=-26; sc.near=8; sc.far=110; sc.updateProjectionMatrix();
scene.add(sun); scene.add(sun.target);
scene.add(new THREE.HemisphereLight(0xcfe4f4,0x6d5c44,0.78));
const fillL = new THREE.DirectionalLight(0xc5d6e6,0.42);
fillL.position.set(-18,16,-12);
scene.add(fillL);
const raycaster = new THREE.Raycaster();
const clock = new THREE.Clock();

function canvasTex(w,h,draw,srgb){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  if(srgb) t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=8;
  return t;
}
function noise(g,w,h,n,a,color){
  for(let i=0;i<n;i++){
    g.fillStyle=color.replace('A',(Math.random()*a).toFixed(3));
    g.fillRect(Math.random()*w,Math.random()*h,Math.random()*40+2,Math.random()*10+1);
  }
}
const deckMap = canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#6a6458'; g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=64){ g.fillStyle='rgba(0,0,0,.18)'; g.fillRect(0,y,w,3); g.fillStyle='rgba(255,255,255,.05)'; g.fillRect(0,y+3,w,1); }
  for(let x=0;x<w;x+=96){ g.fillStyle='rgba(0,0,0,.16)'; g.fillRect(x,0,3,h); }
  noise(g,w,h,80,.25,'rgba(40,30,20,A)');
  g.strokeStyle='rgba(214,195,106,.35)'; g.strokeRect(8,8,w-16,h-16);
},true);
const deckBump = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#808080'; g.fillRect(0,0,w,h);
  g.fillStyle='#aaa'; for(let y=0;y<h;y+=32) g.fillRect(0,y,w,2);
},false);
const hullMap = canvasTex(512,512,(g,w,h)=>{
  const grd=g.createLinearGradient(0,0,0,h);
  grd.addColorStop(0,'#243e58'); grd.addColorStop(.55,'#1a334a'); grd.addColorStop(.78,'#7a3030'); grd.addColorStop(1,'#4a2424');
  g.fillStyle=grd; g.fillRect(0,0,w,h);
  g.fillStyle='rgba(255,255,255,.05)';
  for(let y=18;y<h;y+=22) g.fillRect(0,y,w,1);
  noise(g,w,h,50,.3,'rgba(20,10,6,A)');
  g.fillStyle='rgba(190,198,205,.55)'; g.fillRect(0,210,w,8);
},true);
const contHex=['#8d3d34','#2f5d86','#3e6844','#8a7042','#4c5560'];
function contMat(hex,label){
  const map=canvasTex(256,256,(g,w,h)=>{
    g.fillStyle=hex; g.fillRect(0,0,w,h);
    for(let x=0;x<w;x+=14){ g.fillStyle='rgba(0,0,0,.2)'; g.fillRect(x,0,3,h); g.fillStyle='rgba(255,255,255,.07)'; g.fillRect(x+3,0,1,h); }
    noise(g,w,h,26,.35,'rgba(50,28,12,A)');
    g.fillStyle='rgba(255,255,255,.7)'; g.font='bold 28px Segoe UI,sans-serif'; g.fillText(label,16,230);
    g.strokeStyle='rgba(0,0,0,.35)'; g.strokeRect(10,10,w-20,h-20);
  },true);
  const bump=canvasTex(128,128,(g,w,h)=>{
    g.fillStyle='#777'; g.fillRect(0,0,w,h);
    g.fillStyle='#bbb'; for(let x=0;x<w;x+=8) g.fillRect(x,0,2,h);
  },false);
  return new THREE.MeshStandardMaterial({map,bumpMap:bump,bumpScale:.035,roughness:.74,metalness:.08});
}
const contMats=contHex.map((h,i)=>contMat(h,'NRD '+['A','B','C','D','E'][i]));
const matDeck=new THREE.MeshStandardMaterial({map:deckMap,bumpMap:deckBump,bumpScale:.04,roughness:.92,metalness:.04});
const matHull=new THREE.MeshStandardMaterial({map:hullMap,roughness:.62,metalness:.42});
const matWall=new THREE.MeshStandardMaterial({color:0xc5c8c0,roughness:.8,metalness:.05});
const matRail=new THREE.MeshStandardMaterial({color:0xb7bcc2,roughness:.55,metalness:.35});
const matCrate=new THREE.MeshStandardMaterial({color:0x6a5338,roughness:.86});
const matStair=new THREE.MeshStandardMaterial({color:0x7d7564,roughness:.8,metalness:.08});
const matMetal=new THREE.MeshStandardMaterial({color:0x8d9398,roughness:.42,metalness:.62});
const matYellow=new THREE.MeshStandardMaterial({color:0xc2a24a,roughness:.55,metalness:.25});
const matGlass=new THREE.MeshStandardMaterial({color:0x9fd0de,roughness:.06,metalness:.15,transparent:true,opacity:.28});
const matTrench=new THREE.MeshStandardMaterial({color:0x4a463e,roughness:.95});
const matFunnel=new THREE.MeshStandardMaterial({color:0x2c3034,roughness:.7,metalness:.2});
const matRing=new THREE.MeshStandardMaterial({color:0xd4551d,roughness:.6});
const matLine=new THREE.MeshBasicMaterial({color:0xd6c36a,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
const waterGeo=new THREE.PlaneGeometry(760,760,36,36);
waterGeo.rotateX(-Math.PI/2);
const waterMat=new THREE.MeshStandardMaterial({color:0x167a98,roughness:.16,metalness:.55,transparent:true,opacity:.94});
const water=new THREE.Mesh(waterGeo,waterMat);
water.position.y=-1.75;
water.receiveShadow=true;
water.userData.kind='water';
scene.add(water);
const skyMap=canvasTex(1024,512,(g,w,h)=>{
  const grd=g.createLinearGradient(0,0,0,h);
  grd.addColorStop(0,'#6ea4c8'); grd.addColorStop(.4,'#b9d4e4'); grd.addColorStop(.52,'#d7e3ea'); grd.addColorStop(.72,'#c5d0c8'); grd.addColorStop(1,'#8aa0a8');
  g.fillStyle=grd; g.fillRect(0,0,w,h);
  g.fillStyle='rgba(255,246,214,.95)'; g.beginPath(); g.arc(760,78,26,0,6.3); g.fill();
},true);
const sky=new THREE.Mesh(new THREE.SphereGeometry(430,28,18),new THREE.MeshBasicMaterial({map:skyMap,side:THREE.BackSide,fog:false,depthWrite:false}));
scene.add(sky);
const cloudTex=canvasTex(128,128,(g,w,h)=>{
  const grd=g.createRadialGradient(64,64,8,64,64,60);
  grd.addColorStop(0,'rgba(255,255,255,.55)'); grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,w,h);
},true);
const clouds=[];
for(let i=0;i<9;i++){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:cloudTex,transparent:true,depthWrite:false,opacity:.34,fog:false}));
  s.position.set((Math.random()-0.5)*260,28+Math.random()*18,(Math.random()-0.5)*260);
  s.scale.set(50+Math.random()*50,22+Math.random()*16,1);
  s.userData.sp=1.2+Math.random()*2;
  scene.add(s); clouds.push(s);
}
const dotTex=canvasTex(64,64,(g)=>{
  const grd=g.createRadialGradient(32,32,2,32,32,30);
  grd.addColorStop(0,'#fff'); grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,64,64);
},true);

const geoCache=new Map();
function setBoxUV(geo,w,h,d){
  const uv=geo.attributes.uv;
  if(uv.count!==24) return;
  const dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let f=0;f<6;f++){
    for(let i=0;i<4;i++){
      const idx=f*4+i;

  const minY=y+0.12, maxY=y+h-0.05;

    const cx=x<b.min.x?b.min.x:x>b.max.x?b.max.x:x;
    const cz=z<b.min.z?b.min.z:z>b.max.z?b.max.z:z;

  }

  const steps=Math.max(2,Math.ceil(dist/0.85));

    const t=i/steps;

function route(a,b){

    const c=q[qi];

    }

  if(keys['Tab']){ $('board').style.display='block'; renderBoard(); }
  else $('board').style.display='none';
}
let indQ=[];
function addInd(x,z){
  computeBasis();
  const dx=x-player.x, dz=z-player.z;
  const ang=Math.atan2(dx*right.x+dz*right.z, dx*forward.x+dz*forward.z);
  indQ.push({ang,t:performance.now()});
}
function setToast(text,time){
  $('toast').textContent=text; toastT=time;
}
function hitMark(head){
  const h=$('hit'); h.classList.toggle('hs',!!head); h.style.opacity='1'; hitFade=0.12;
}
function feed(text){
  const d=document.createElement('div'); d.textContent=text; $('feed').appendChild(d);
  while($('feed').children.length>5) $('feed').firstChild.remove();
  setTimeout(()=>d.remove(),4200);
}
function renderBoard(){
  const rows=[{name:'你',k:player.kills,d:player.deaths,me:true}].concat(bots.map(b=>({name:b.name,k:b.kills,d:b.deaths})));
  rows.sort((a,b)=>b.k-a.k||a.d-b.d);
  let html='<h3>计分</h3><table>';
  for(const r of rows) html+='<tr class="'+(r.me?'me':'')+'"><td>'+r.name+'</td><td>'+r.k+' 击倒</td><td>'+r.d+' 阵亡</td></tr>';
  $('board').innerHTML=html+'</table>';
}
const mini=$('map'), mctx=mini.getContext('2d');
const staticMini=document.createElement('canvas'); staticMini.width=180; staticMini.height=180;
function miniXY(x,z){
  const pad=16,S=180;
  return [pad+(x+13)/26*(S-pad*2), pad+(z+58)/116*(S-pad*2)];
}
function wrect(ctx,x0,z0,x1,z1,fill){
  const A=miniXY(x0,z0), B=miniXY(x1,z1);
  ctx.fillStyle=fill;
  ctx.fillRect(Math.min(A[0],B[0]),Math.min(A[1],B[1]),Math.abs(B[0]-A[0]),Math.abs(B[1]-A[1]));
}
function drawStaticMini(){
  const c=staticMini.getContext('2d');
  c.clearRect(0,0,180,180);
  c.fillStyle='#16384a'; c.fillRect(0,0,180,180);
  wrect(c,-13,-58,13,58,'#6a6458');
  wrect(c,-4.2,-8,4.2,8,'#3a342c');
  wrect(c,-9.7,43,3.5,56.6,'#b7b8b2');
  wrect(c,-4.3,-57.3,4.3,-49.4,'#b7b8b2');
  for(const b of mapBlips){
    c.fillStyle=b.color;
    wrect(c,b.x-b.w/2,b.z-b.d/2,b.x+b.w/2,b.z+b.d/2,b.color);
  }
  c.fillStyle='#e6d7b0'; c.font='11px Microsoft YaHei,sans-serif'; c.textAlign='center';
  const bow=miniXY(0,-54), stern=miniXY(0,54);
  c.fillText('船头',bow[0],bow[1]); c.fillText('船尾',stern[0],stern[1]);
}
function drawMini(){
  mctx.clearRect(0,0,180,180);
  mctx.drawImage(staticMini,0,0);
  for(const b of bots){
    if(!b.alive) continue;
    const p=miniXY(b.x,b.z);
    mctx.fillStyle='#e24b4b';
    mctx.beginPath(); mctx.arc(p[0],p[1],3,0,6.3); mctx.fill();
  }
  for(const pk of pickups){
    if(!pk.alive) continue;
    const p=miniXY(pk.x,pk.z);
    mctx.fillStyle=pk.kind==='hp'?'#3ecf6e':'#e0b14a';
    mctx.fillRect(p[0]-2,p[1]-2,4,4);
  }
  const pp=miniXY(player.x,player.z);
  mctx.save();
  mctx.translate(pp[0],pp[1]);
  mctx.rotate(Math.atan2(forward.x,-forward.z));
  mctx.fillStyle='#f2efe6';
  mctx.beginPath(); mctx.moveTo(0,-7); mctx.lineTo(4.5,5); mctx.lineTo(0,2.5); mctx.lineTo(-4.5,5); mctx.closePath(); mctx.fill();
  mctx.restore();
}
function ensureAudio(){
  if(ac){ if(ac.state==='suspended') ac.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  ac=new AC();
  master=ac.createGain(); master.gain.value=0.45; master.connect(ac.destination);
  const dur=2, buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate), data=buf.getChannelData(0);
  let last=0;
  for(let i=0;i<data.length;i++){ last=(last+(Math.random()*2-1)*0.2)*0.96; data[i]=last; }
  const src=ac.createBufferSource(); src.buffer=buf; src.loop=true;
  const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=400;
  windGain=ac.createGain(); windGain.gain.value=0.08;
  src.connect(f); f.connect(windGain); windGain.connect(master); src.start();
  const buf2=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate), d2=buf2.getChannelData(0);
  for(let i=0;i<d2.length;i++) d2[i]=(Math.random()*2-1)*Math.pow(1-(i%d2.length)/d2.length,0.2)*0.2;
  const src2=ac.createBufferSource(); src2.buffer=buf2; src2.loop=true;
  const f2=ac.createBiquadFilter(); f2.type='lowpass'; f2.frequency.value=220;
  const g2=ac.createGain(); g2.gain.value=0.05;
  src2.connect(f2); f2.connect(g2); g2.connect(master); src2.start();
}
function noiseBurst(freq,dur,vol){
  if(!ac||muted) return;
  const len=Math.floor(ac.sampleRate*dur);
  const buf=ac.createBuffer(1,len,ac.sampleRate), data=buf.getChannelData(0);
  for(let i=0;i<len;i++){ const e=Math.pow(1-i/len,2.4); data[i]=(Math.random()*2-1)*e; }
  const src=ac.createBufferSource(); src.buffer=buf;
  const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq;
  const g=ac.createGain(); g.gain.value=vol;
  src.connect(f); f.connect(g); g.connect(master); src.start();
}
function gunAudio(freq,dur,vol){ noiseBurst(freq,dur,vol); }
function dry(){ noiseBurst(1800,0.03,0.08); }
function reloadSnd(){ noiseBurst(1200,0.05,0.12); setTimeout(()=>noiseBurst(800,0.06,0.1),160); }
function pain(){ if(!ac||muted) return; const o=ac.createOscillator(), g=ac.createGain(); o.type='sawtooth'; o.frequency.value=90; g.gain.value=0.08; o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime+0.12); }
function foot(){ noiseBurst(240,0.04,0.05); }
function whiz(){ noiseBurst(3200,0.05,0.06); }
function pickupSnd(){ if(!ac||muted) return; const o=ac.createOscillator(), g=ac.createGain(); o.type='square'; o.frequency.value=660; g.gain.value=0.05; o.connect(g); g.connect(master); o.start(); o.frequency.setValueAtTime(880,ac.currentTime+0.06); o.stop(ac.currentTime+0.12); }
function toggleMute(){
  muted=!muted;
  if(master) master.gain.value=muted?0:0.45;
  setToast(muted?'静音':'声音开',0.6);
}
function showOverlay(which){
  $('ov').classList.remove('hide');
  $('menu').style.display=which==='menu'?'block':'none';
  $('pause').style.display=which==='pause'?'block':'none';
  $('end').style.display=which==='end'?'block':'none';
}
function hideOv(){ $('ov').classList.add('hide'); }
function resume(){
  ensureAudio();
  if(mode==='menu'||mode==='end') startMatch();
  paused=false;
  renderer.domElement.requestPointerLock();
}
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);
});
document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement!==renderer.domElement) return;
  if(!(mode==='play'||mode==='dead')) return;
  const sens=0.00215*sensMul*(1-adsBlend*0.42);
  player.yaw-=e.movementX*sens;
  player.pitch-=e.movementY*sens;
  if(player.pitch>1.15) player.pitch=1.15;
  if(player.pitch<-1.15) player.pitch=-1.15;
});
document.addEventListener('mousedown',e=>{
  if(e.button===0) lmb=true;
  if(e.button===2) rmb=true;
});
document.addEventListener('mouseup',e=>{
  if(e.button===0) lmb=false;
  if(e.button===2) rmb=false;
});
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['Space','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(mode!=='play'&&mode!=='dead') return;
  if(e.code==='KeyR') startReload();
  if(e.code==='Digit1'||e.code==='Numpad1') switchGun('rifle');
  if(e.code==='Digit2'||e.code==='Numpad2') switchGun('pistol');
  if(e.code==='Digit3'||e.code==='Numpad3') switchGun('shotgun');
  if(e.code==='KeyM') toggleMute();
});
document.addEventListener('keyup',e=>{ keys[e.code]=false; });
document.addEventListener('pointerlockchange',()=>{
  const on=document.pointerLockElement===renderer.domElement;
  if(on){ paused=false; hideOv(); }
  else {
    lmb=false; rmb=false;
    if(mode==='play'||mode==='dead'){ paused=true; showOverlay('pause'); }
  }
});
document.querySelectorAll('.sens').forEach(el=>{
  el.addEventListener('input',()=>{
    sensMul=parseFloat(el.value);
    document.querySelectorAll('.sens').forEach(s=>s.value=el.value);
  });
});
$('play').addEventListener('click',resume);
$('resume').addEventListener('click',resume);
$('again').addEventListener('click',resume);
let heartT=0;
function animate(){
  requestAnimationFrame(animate);
  let dt=clock.getDelta();
  if(dt>0.05) dt=0.05;
  if(mode==='menu'||mode==='end'){
    if(mode==='menu'||mode==='end') updateBotMove(dt);
    updateCinematic(dt);
    updateFX(dt);
    sky.position.copy(yawRig.position);
    updateSun();
    renderer.render(scene,camera);
    return;
  }
  const sim=!paused;
  if(sim){
    if(mode==='play'&&countdown>0){
      countdown-=dt; player.invul=Math.max(player.invul,countdown);
      if(countdown<=0) goT=0.7;
    }else if(mode==='play') remain-=dt;
    if(player.invul>0) player.invul-=dt;
    adsBlend=THREE.MathUtils.damp(adsBlend,(rmb&&player.alive&&mode==='play'&&!sprinting)?1:0,14,dt);
    if(mode==='play'&&player.alive&&countdown<=0) updateMove(dt);
    if(mode==='dead'){
      player.pitch=THREE.MathUtils.damp(player.pitch,-0.5,3,dt);
      deathT-=dt;
      if(deathT<=0) respawnPlayer();
    }
    if(countdown<=0) updateBotMove(dt);
    if(player.alive&&player.hp<35&&mode==='play'){
      heartT-=dt;
      if(heartT<=0){ heartT=0.7; pain(); }
    }
  }
  updateCameraRig(dt);
  scene.updateMatrixWorld(true);
  if(sim&&mode==='play'&&player.alive&&countdown<=0) tryFire(dt);
  lmbPrev=lmb;
  if(sim&&countdown<=0&&(mode==='play'||mode==='dead')) updateBotCombat(dt);
  updateVM(dt);
  updateFX(dt);
  for(const pk of pickups){
    if(!pk.alive){ pk.t-=dt; if(pk.t<=0){ pk.alive=true; pk.mesh.visible=true; } continue; }
    pk.mesh.position.y=pk.y+0.32+Math.sin(performance.now()*0.003+pk.x)*0.08;
    pk.mesh.rotation.y+=dt;
  }
  if(sim&&mode==='play'&&countdown<=0) checkEnd();
  sky.position.copy(yawRig.position);
  updateSun();
  updateHUD(dt);
  renderer.render(scene,camera);
}
function initPools(){
  for(let i=0;i<20;i++){
    const mat=new THREE.SpriteMaterial({map:dotTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:0});
    const mesh=new THREE.Sprite(mat); mesh.visible=false; mesh.scale.set(0.18,0.18,0.18); scene.add(mesh);
    sparks.push({on:false,mesh,life:0,vx:0,vy:0,vz:0});
  }
  for(let i=0;i<16;i++){
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.015,0.05),new THREE.MeshStandardMaterial({color:0xc9a24a,metalness:.8,roughness:.3}));
    mesh.visible=false; scene.add(mesh);
    shells.push({on:false,mesh,life:0,vx:0,vy:0,vz:0});
  }
  for(let i=0;i<8;i++){
    const d=document.createElement('i'); $('inds').appendChild(d); indEls.push(d);
  }
}
function boot(){
  try{
    buildWorld();
    scene.updateMatrixWorld(true);
    buildNav();
    BOTS_DEF.forEach((d,i)=>makeBot(d,i));
    bots.forEach((b,i)=>spawnBot(b,i));
    vms.rifle=gunMesh('rifle'); vms.pistol=gunMesh('pistol'); vms.shotgun=gunMesh('shotgun');
    showGun('rifle');
    for(const k in vms) vms[k].visible=false;
    addPickup('hp',7.3,0,20); addPickup('hp',-7.3,0,-22); addPickup('hp',0,-3.15,0); addPickup('hp',-2,3.9,50);
    addPickup('ammo',0,0,36); addPickup('ammo',7.3,0,-34); addPickup('ammo',-7.3,0,12); addPickup('ammo',1.2,0,49);
    bulletList=solids.concat([water],botTargets);
    initPools();
    drawStaticMini();
    animate();
  }catch(err){
    const pre=document.createElement('pre'); pre.id='err'; pre.textContent=String(err&&err.stack||err); document.body.appendChild(pre);
  }
}
boot();
}
